<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos Customizados - Ateliê Personalíssimo</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pedidos.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Ateliê Personalíssimo</a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#sobre">Sobre</a></li>
        <li><a href="galeria.html">Galeria</a></li>
        <li><a href="pedidos.html">Pedidos Customizados</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="box-form">
      <h1>Agendamento</h1>

      <form action="#" method="POST">
        <div class="grupo">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required>
        </div>

        <div class="grupo">
          <label for="ocasiao">Ocasião:</label>
          <select id="ocasiao" name="ocasiao" required>
            <option value="">Escolha uma opção</option>
            <option value="noivas">Noivas e Festa</option>
            <option value="alfaiataria">Alfaiataria Feminina</option>
            <option value="outros">Outros</option>
          </select>
        </div>

        <div class="linha">
          <div class="grupo">
            <label for="data">Data:</label>
            <input type="date" id="data" name="data" required>
          </div>

          <div class="grupo">
            <label for="hora">Hora:</label>
            <input type="time" id="hora" name="hora" required>
          </div>
        </div>

        <div class="grupo">
          <label for="tecido">Tipo de Tecido:</label>
          <input type="text" id="tecido" name="tecido">
        </div>

        <div class="grupo">
          <label for="descricao">Descreva a Roupa:</label>
          <textarea id="descricao" name="descricao" rows="4"></textarea>
        </div>

        <div class="grupo">
          <label for="imagem">Imagem referência:</label>
          <input type="file" id="imagem" name="imagem" accept="image/*">
        </div>

        <div class="grupo">
          <label for="contato">Número para contato:</label>
          <input type="tel" id="contato" name="contato" placeholder="(00) 00000-0000" required>
        </div>

        <div class="botoes">
          <button type="reset" class="btn-limpar">Cancelar</button>
          <button type="submit" class="btn-enviar">Enviar</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <div class="contatos-footer">
      <span>@AteliePersonalissimo</span>
      <span>AteliePersonalissimo@gmail.com</span>
    </div>
    <p>Desenvolvido por Bruno Moreira, Júlio Cezar, Gabriel Torres, Arthur Pereira e Pedro Assis - 2026</p>
  </footer>

</body>
</html>
